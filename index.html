<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Todo Cosas</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fff8f0; --card:#ffffff; --text:#241c15; --muted:#8a7a6b; --coral:#ff6b4a; --teal:#1fb6a8; --yellow:#ffc93c; --border:#f0e4d6;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
body{margin:0;font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);}
header{position:sticky;top:0;padding:calc(20px + env(safe-area-inset-top,0px)) 18px 22px;background:linear-gradient(120deg,var(--teal),#159c8f 60%,var(--coral));color:#fff;z-index:10;overflow:hidden;position:relative;}
header::after{content:"";position:absolute;right:-30px;top:-30px;width:140px;height:140px;background:var(--yellow);opacity:.25;border-radius:50%;}
h1{margin:0;font-family:'Baloo 2',sans-serif;font-weight:800;font-size:30px;letter-spacing:.2px;position:relative;}
.sub{color:#eafffb;font-size:13px;margin-top:4px;position:relative;}
.wrap{max-width:720px;margin:0 auto;padding:0 16px 90px;}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:14px 16px 0;max-width:688px;margin:0 auto;}
.tab{flex:none;padding:7px 16px;border-radius:999px;border:2px solid var(--border);background:var(--card);color:var(--text);font-size:13px;font-weight:600;cursor:pointer;}
.tab.active{background:var(--coral);border-color:var(--coral);color:#fff;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px;margin-top:16px;}
.card{background:var(--card);border:2px solid var(--border);border-radius:18px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 3px 0 var(--border);}
.card img{width:100%;aspect-ratio:1/1;object-fit:cover;background:var(--bg);display:block;}
.icon-badge{width:100%;aspect-ratio:1/1;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:40px;}
.card-body{flex:1;min-width:0;padding:12px;display:flex;flex-direction:column;}
.card h3{margin:0 0 4px;font-size:15px;font-weight:700;line-height:1.25;}
.card p{margin:0;color:var(--muted);font-size:12px;line-height:1.4;}
.row{display:flex;justify-content:space-between;align-items:center;margin-top:10px;gap:8px;flex-wrap:wrap;}
.price{font-family:'Baloo 2',sans-serif;font-weight:700;font-size:22px;color:var(--coral);}
.stock{font-size:12px;color:var(--teal);font-weight:600;margin-top:2px;}
.stock.low{color:var(--coral);}
.stock.low::before{content:"🔥 ";}
.qty{display:flex;align-items:center;gap:8px;}
.qty button{width:30px;height:30px;border-radius:8px;border:2px solid var(--border);background:var(--bg);color:var(--text);font-size:16px;cursor:pointer;font-weight:700;}
.qty span{min-width:22px;text-align:center;font-weight:700;}
.buy{background:#25d366;color:#fff;border:none;border-radius:999px;padding:10px 16px;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap;}
.buy:disabled{background:var(--border);color:var(--muted);cursor:not-allowed;}
.admin-btn{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));right:16px;background:var(--text);color:#fff;border:none;border-radius:999px;padding:13px 20px;font-weight:700;font-size:14px;box-shadow:0 4px 14px rgba(0,0,0,.25);cursor:pointer;z-index:20;}
.modal-bg{display:none;position:fixed;inset:0;background:rgba(36,28,21,.55);z-index:30;align-items:flex-end;justify-content:center;}
.modal-bg.open{display:flex;}
.modal{background:var(--card);width:100%;max-width:720px;max-height:85vh;overflow-y:auto;border-radius:22px 22px 0 0;padding:22px;padding-bottom:calc(22px + env(safe-area-inset-bottom,0px));}
.modal h2{margin-top:0;font-family:'Baloo 2',sans-serif;font-size:22px;}
.field{margin-bottom:12px;}
label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px;font-weight:600;}
input,select,textarea{width:100%;padding:10px 12px;border-radius:10px;border:2px solid var(--border);background:var(--bg);color:var(--text);font-size:14px;font-family:inherit;}
.prod-row{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border);padding:10px 0;gap:8px;}
.prod-row div:first-child{font-size:14px;}
.prod-row button{border:none;background:none;color:var(--coral);font-size:13px;cursor:pointer;font-weight:700;}
.save-btn{background:var(--coral);color:#fff;border:none;border-radius:12px;padding:12px;width:100%;font-weight:700;margin-top:6px;cursor:pointer;font-size:14px;}
.save-btn.secondary{background:var(--text);}
.empty{text-align:center;color:var(--muted);padding:40px 0;font-size:14px;}
.empty::before{content:"🧰";display:block;font-size:40px;margin-bottom:8px;}
.error{color:#c62828;font-size:13px;margin-top:6px;}
</style>
</head>
<body>
<header>
  <h1>Todo Cosas</h1>
  <div class="sub">Herramientas, pinturas de piscina, motores de portón y más</div>
</header>
<div class="tabs" id="tabs"></div>
<div class="wrap"><div class="grid" id="grid"></div></div>

<button class="admin-btn" id="adminBtn">Admin</button>

<div class="modal-bg" id="loginModalBg">
  <div class="modal">
    <h2>Iniciar sesión</h2>
    <div class="field"><label>Correo</label><input id="loginEmail" type="email"></div>
    <div class="field"><label>Contraseña</label><input id="loginPass" type="password"></div>
    <div class="error" id="loginError"></div>
    <button class="save-btn" id="loginBtn">Entrar</button>
    <button class="save-btn secondary" id="loginCancel">Cancelar</button>
  </div>
</div>

<div class="modal-bg" id="modalBg">
  <div class="modal">
    <h2 id="modalTitle">Producto</h2>
    <div class="field"><label>Nombre</label><input id="fName"></div>
    <div class="field"><label>Categoría</label>
      <select id="fCat"><option>Herramientas</option><option>Pinturas de piscina</option><option>Motores de portón</option><option>Otros</option></select>
    </div>
    <div class="field"><label>Precio (CLP)</label><input id="fPrice" type="number" min="0"></div>
    <div class="field"><label>Stock</label><input id="fStock" type="number" min="0"></div>
    <div class="field"><label>Foto del producto (opcional)</label>
      <input id="fImgFile" type="file" accept="image/*">
      <img id="fImgPreview" style="display:none;margin-top:8px;max-width:120px;border-radius:10px;">
    </div>
    <div class="field"><label>Descripción (opcional)</label><textarea id="fDesc" rows="2"></textarea></div>
    <button class="save-btn" id="fSave">Guardar producto</button>
  </div>
</div>

<div class="modal-bg" id="adminModalBg">
  <div class="modal">
    <h2>Panel de administrador</h2>
    <button class="save-btn" id="newProdBtn">+ Agregar producto</button>
    <div id="adminList" style="margin-top:16px;"></div>
    <button class="save-btn secondary" id="logoutBtn">Cerrar sesión</button>
    <button class="save-btn secondary" id="closeAdmin">Cerrar panel</button>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
import { getFirestore, collection, onSnapshot, addDoc, updateDoc, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBJ70oiV3o3u-QZh2EHfcRhg7b4EV0Qz7U",
  authDomain: "todo-cosas.firebaseapp.com",
  projectId: "todo-cosas",
  storageBucket: "todo-cosas.firebasestorage.app",
  messagingSenderId: "881981472188",
  appId: "1:881981472188:web:696cf8cdc24915bdaa7fb9"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const productosRef = collection(db, "productos");

const WHATSAPP = "56981754395";
const ICONS = {"Herramientas":"🔧","Pinturas de piscina":"🎨","Motores de portón":"⚙️","Otros":"📦"};
let PRODUCTS = [];
let editingId = null;
let currentImg = "";
let activeCat = "Todos";

function resizeImage(file, maxDim=600, quality=0.7){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onerror = reject;
    reader.onload = e=>{
      const img = new Image();
      img.onerror = reject;
      img.onload = ()=>{
        let {width,height} = img;
        if(width>height){ if(width>maxDim){height*=maxDim/width; width=maxDim;} }
        else { if(height>maxDim){width*=maxDim/height; height=maxDim;} }
        const canvas = document.createElement("canvas");
        canvas.width=width; canvas.height=height;
        canvas.getContext("2d").drawImage(img,0,0,width,height);
        resolve(canvas.toDataURL("image/jpeg",quality));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}
let qtyState = {};
let isAdmin = false;

const $ = id => document.getElementById(id);
function fmt(n){return "$"+Number(n).toLocaleString("es-CL");}
function categories(){return [...new Set(PRODUCTS.map(p=>p.cat))];}

function renderTabs(){
  const cats = ["Todos", ...categories()];
  $("tabs").innerHTML = cats.map(c=>
    `<button class="tab ${c===activeCat?'active':''}" data-cat="${c}">${ICONS[c]?ICONS[c]+' ':''}${c}</button>`).join("");
  document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{activeCat=b.dataset.cat;render();});
}

function renderGrid(){
  const list = PRODUCTS.filter(p=>activeCat==="Todos"||p.cat===activeCat);
  const grid = $("grid");
  if(!list.length){grid.innerHTML='<div class="empty">No hay productos en esta categoría todavía.</div>';return;}
  grid.innerHTML = list.map(p=>{
    const q = qtyState[p.id]||1;
    const low = p.stock<=3 && p.stock>0;
    const out = p.stock<=0;
    return `<div class="card">
      ${p.img?`<img src="${p.img}" alt="">`:`<div class="icon-badge">${ICONS[p.cat]||'🧰'}</div>`}
      <div class="card-body">
        <h3>${p.name}</h3>
        ${p.desc?`<p>${p.desc}</p>`:""}
        <div class="row">
          <div>
            <div class="price">${fmt(p.price)}</div>
            <div class="stock ${low?'low':''}">${out?'Sin stock':'Stock: '+p.stock+' disponibles'}</div>
          </div>
        </div>
        <div class="row">
          <div class="qty">
            <button data-act="dec" data-id="${p.id}" ${out?'disabled':''}>-</button>
            <span>${q}</span>
            <button data-act="inc" data-id="${p.id}" ${out?'disabled':''}>+</button>
          </div>
          <button class="buy" data-id="${p.id}" ${out?'disabled':''}>Pedir por WhatsApp</button>
        </div>
      </div>
    </div>`;
  }).join("");

  grid.querySelectorAll("[data-act]").forEach(b=>b.onclick=()=>{
    const p = PRODUCTS.find(x=>x.id===b.dataset.id);
    let q = qtyState[p.id]||1;
    if(b.dataset.act==="inc") q = Math.min(p.stock,q+1);
    else q = Math.max(1,q-1);
    qtyState[p.id]=q;
    renderGrid();
  });
  grid.querySelectorAll(".buy").forEach(b=>b.onclick=()=>{
    const p = PRODUCTS.find(x=>x.id===b.dataset.id);
    const q = qtyState[p.id]||1;
    const msg = `Hola! Quiero pedir: ${p.name} x${q} (${fmt(p.price*q)}). ¿Está disponible?`;
    window.open(`https://wa.me/${WHATSAPP}?text=${encodeURIComponent(msg)}`,"_blank");
  });
}

function render(){renderTabs();renderGrid();}

onSnapshot(productosRef, snap=>{
  PRODUCTS = snap.docs.map(d=>({id:d.id, ...d.data()}));
  render();
  if($("adminModalBg").classList.contains("open")) renderAdminList();
});

onAuthStateChanged(auth, user=>{
  isAdmin = !!user;
  $("adminBtn").textContent = isAdmin ? "Panel admin" : "Admin";
});

$("adminBtn").onclick=()=>{
  if(isAdmin){ renderAdminList(); $("adminModalBg").classList.add("open"); }
  else { $("loginError").textContent=""; $("loginModalBg").classList.add("open"); }
};
$("loginCancel").onclick=()=>$("loginModalBg").classList.remove("open");
$("loginBtn").onclick=async()=>{
  try{
    await signInWithEmailAndPassword(auth, $("loginEmail").value.trim(), $("loginPass").value);
    $("loginModalBg").classList.remove("open");
    renderAdminList();
    $("adminModalBg").classList.add("open");
  }catch(e){ $("loginError").textContent = "Correo o contraseña incorrectos."; }
};
$("logoutBtn").onclick=async()=>{ await signOut(auth); $("adminModalBg").classList.remove("open"); };
$("closeAdmin").onclick=()=>$("adminModalBg").classList.remove("open");

function renderAdminList(){
  const el = $("adminList");
  if(!PRODUCTS.length){el.innerHTML='<div class="empty">Sin productos aún.</div>';return;}
  el.innerHTML = PRODUCTS.map(p=>`<div class="prod-row">
    <div>${ICONS[p.cat]||''} ${p.name} — ${fmt(p.price)} — stock ${p.stock}</div>
    <div><button data-id="${p.id}" data-act="edit">Editar</button> <button data-id="${p.id}" data-act="del">Eliminar</button></div>
  </div>`).join("");
  el.querySelectorAll("[data-act=edit]").forEach(b=>b.onclick=()=>openForm(b.dataset.id));
  el.querySelectorAll("[data-act=del]").forEach(b=>b.onclick=async()=>{
    await deleteDoc(doc(db,"productos",b.dataset.id));
  });
}

$("newProdBtn").onclick=()=>openForm(null);

function openForm(id){
  editingId=id;
  const p = PRODUCTS.find(x=>x.id===id);
  $("modalTitle").textContent = p?"Editar producto":"Nuevo producto";
  $("fName").value = p?p.name:"";
  $("fCat").value = p?p.cat:"Herramientas";
  $("fPrice").value = p?p.price:"";
  $("fStock").value = p?p.stock:"";
  $("fDesc").value = p?(p.desc||""):"";
  currentImg = p?(p.img||""):"";
  $("fImgFile").value = "";
  if(currentImg){ $("fImgPreview").src = currentImg; $("fImgPreview").style.display="block"; }
  else { $("fImgPreview").style.display="none"; }
  $("modalBg").classList.add("open");
}
$("fImgFile").onchange=async()=>{
  const file = $("fImgFile").files[0];
  if(!file) return;
  const dataUrl = await resizeImage(file);
  $("fImgPreview").src = dataUrl;
  $("fImgPreview").style.display="block";
};

$("fSave").onclick=async()=>{
  const name = $("fName").value.trim();
  if(!name){alert("Ponle un nombre al producto");return;}
  const img = $("fImgPreview").style.display==="block" ? $("fImgPreview").src : "";
  const data = {
    name, cat: $("fCat").value,
    price: Number($("fPrice").value)||0,
    stock: Number($("fStock").value)||0,
    img,
    desc: $("fDesc").value.trim()
  };
  if(editingId) await updateDoc(doc(db,"productos",editingId), data);
  else await addDoc(productosRef, data);
  $("modalBg").classList.remove("open");
};
</script>
</body>
</html>
